<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-navy text-cream h-screen flex flex-col">
  <header class="flex flex-wrap items-center justify-between gap-3 px-5 py-3">
    <div class="flex items-baseline gap-4">
      <h1 class="font-display text-2xl tracking-tight">SYNC<span class="text-sky">FLOW</span></h1>

    <nav class="flex flex-wrap gap-2 text-sm">
      <a href="/" class="px-4 py-1.5 rounded-full bg-sky text-navy font-semibold">Split screen</a>
      <a href="/student/" class="px-4 py-1.5 rounded-full bg-white/5 hover:bg-white/10 text-mist">Student</a>

  <main class="flex-1 grid grid-cols-1 lg:grid-cols-[460px_1fr] gap-3 px-3 pb-3 min-h-0">

    <div class="grid grid-rows-2 gap-3 min-h-0">
      <iframe src="/vendor/?shop=tokyo-bento&embed=1" class="w-full h-full rounded-[28px] bg-navy-2" title="Tokyo Bento KDS"></iframe>
      <iframe src="/vendor/?shop=brewlab&embed=1" class="w-full h-full rounded-[28px] bg-navy-2" title="BrewLab KDS"></iframe>
