<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncFlow · Student</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
</head>
<body class="bg-slate-900 text-slate-100">
  <div class="phone-frame relative pb-28">
    <header class="px-5 pt-6 pb-3">
      <p class="text-xs text-slate-400">Good afternoon 👋</p>
      <h1 class="text-xl font-bold">Sync<span class="text-cyan-400">Flow</span> Campus</h1>
    </header>

    <!-- Sync My Schedule widget (Person 3) -->
    <section class="mx-4 mb-4 p-4 rounded-2xl bg-slate-800/70 border border-slate-700">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-semibold text-sm">📅 Sync My Schedule</h2>
        <button id="load-sample" class="text-xs text-cyan-400 hover:underline">Load Replacement Class Notice</button>
      </div>
      <textarea id="notice" rows="3" placeholder="Paste a class or replacement-class announcement..."
        class="w-full text-sm rounded-lg bg-slate-900 border border-slate-700 p-2 focus:outline-none focus:border-cyan-500"></textarea>
      <button id="parse-btn" class="mt-2 w-full py-2 rounded-lg bg-cyan-500 text-slate-950 text-sm font-semibold">Find my break window</button>
      <form id="timetable-upload" class="mt-3 border-t border-slate-700 pt-3">
        <label for="timetable-file" class="block text-xs font-semibold">School timetable (PDF, PNG, or JPG)</label>
        <input id="timetable-file" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" required
          class="mt-1 w-full text-xs text-slate-300" />
        <button id="upload-timetable-btn" type="submit" class="mt-2 w-full py-2 rounded-lg border border-cyan-500 text-cyan-300 text-sm font-semibold">Upload timetable</button>
      </form>
      <div id="gap-result" class="mt-3 text-sm hidden" aria-live="polite"></div>    </section>

    <!-- Category filter + shop catalog (Person 2) -->
    <section id="catalog-view">
      <div id="filters" class="flex gap-2 px-4 mb-3 overflow-x-auto text-xs"></div>
      <div id="shops" class="px-4 space-y-4"></div>
    </section>

    <!-- Live Sync-Prep radar (shown after checkout) -->
    <section id="tracker-view" class="hidden px-4 fade-in"></section>

    <!-- Floating global cart bar -->
    <button id="cart-bar" class="hidden absolute bottom-4 left-4 right-4 py-3 px-4 rounded-2xl bg-cyan-500 text-slate-950 font-semibold flex justify-between glow-cyan">
      <span id="cart-count">0 items</span><span id="cart-total">$0.00</span>
    </button>

    <!-- Cart drawer -->
    <div id="cart-drawer" class="hidden absolute inset-0 bg-black/60 flex items-end">
      <div class="w-full bg-slate-900 rounded-t-3xl p-5 max-h-[80%] overflow-y-auto fade-in">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold">Your cart</h2>
          <button id="close-cart" class="text-slate-400">✕</button>
        </div>
        <div id="cart-lines" class="space-y-3 text-sm"></div>
        <button id="checkout-btn" class="mt-4 w-full py-3 rounded-xl bg-green-400 text-slate-950 font-bold">Campus Pay · Checkout</button>
      </div>
    </div>

    <!-- Student identity modal -->
    <div id="identity-modal" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center p-6 z-10">
      <div class="w-full bg-slate-900 rounded-2xl p-5 fade-in">
        <h2 class="font-bold mb-3">Confirm your details</h2>
          <label class="block text-xs text-slate-400 mb-1">Full name</label>
          <input id="student-name-input" type="text" placeholder="e.g. Eashwar Singh"
            class="w-full mb-3 text-sm rounded-lg bg-slate-800 border border-slate-700 p-2 focus:outline-none focus:border-cyan-500" />
          <label class="block text-xs text-slate-400 mb-1">Student ID</label>
          <input id="student-id-input" type="text" placeholder="e.g. A21CS0142"
            class="w-full mb-4 text-sm rounded-lg bg-slate-800 border border-slate-700 p-2 focus:outline-none focus:border-cyan-500" />
          <div class="flex gap-2">
            <button id="identity-cancel" class="flex-1 py-2 rounded-lg bg-slate-800 text-sm disabled:opacity-50">Cancel</button>
            <button id="identity-confirm" class="flex-1 py-2 rounded-lg bg-green-400 text-slate-950 font-semibold text-sm disabled:opacity-60">Confirm & Pay</button>
          </div>
      </div>
    </div>
  </div>
  <script src="/student/app.js"></script>
</body>
</html>
