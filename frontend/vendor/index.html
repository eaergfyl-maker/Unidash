<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncFlow · Kitchen Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header id="kds-header" class="flex items-center justify-between px-4 py-2 border-b border-slate-800">
    <h1 class="font-bold">🍳 Kitchen Display <span class="text-xs text-slate-400 font-normal">Sync-Fire KDS</span></h1>
    <nav id="tabs" class="flex gap-2 text-sm"></nav>
  </header>

  <main class="grid grid-cols-3 gap-3 p-3">
    <section>
      <h2 class="text-xs uppercase tracking-wide text-amber-300 mb-2">Staged / Held <span class="text-slate-500">(Smart Queue Delay)</span></h2>
      <div id="col-STAGED" class="space-y-2"></div>
    </section>
    <section>
      <h2 class="text-xs uppercase tracking-wide text-red-400 mb-2">Active Cooking / Prepare Now</h2>
      <div id="col-COOKING" class="space-y-2"></div>
    </section>
    <section>
      <h2 class="text-xs uppercase tracking-wide text-green-400 mb-2">Ready for Collection</h2>
      <div id="col-READY" class="space-y-2"></div>
    </section>
  </main>
  <script src="/vendor/kds.js"></script>
</body>
</html>
