<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncFlow · Kitchen Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/theme.js?v=4"></script>
  <link rel="stylesheet" href="/assets/css/custom.css?v=4" />
</head>
<body class="bg-navy text-cream min-h-screen flex flex-col relative overflow-x-hidden">
  <div class="blob blob-circle kds-blob" style="width:420px;height:420px;bottom:-220px;left:-160px;"></div>
  <div class="blob blob-slab kds-blob opacity-40" style="width:360px;height:360px;top:-240px;right:-120px;"></div>

  <header id="kds-header" class="relative z-10 flex items-center justify-between gap-3 px-5 py-3">
    <div class="flex items-baseline gap-3 whitespace-nowrap">
      <h1 class="font-display uppercase text-lg tracking-tight">Kitchen <span class="text-sky">Display</span></h1>
      <span class="kds-subtitle eyebrow text-mist/60">Sync-Fire KDS</span>
    </div>
    <div class="flex items-center gap-2 min-w-0">
      <nav id="tabs" class="flex gap-2 text-sm overflow-x-auto"></nav>
      <button id="sound-btn" type="button" class="px-3 py-1 rounded-full text-xs"></button>
      <button id="reset-demo" type="button" class="px-3 py-1 rounded-full text-xs bg-white/5 text-mist/60 hover:bg-ember hover:text-navy">Reset demo</button>
    </div>
  </header>

  <div id="kds-error" class="hidden relative z-10 mx-4 mb-2 px-4 py-2 rounded-2xl bg-ember/20 text-ember text-sm" role="alert"></div>

  <main class="kds-board relative z-10 flex-1 grid grid-cols-3 gap-4 px-4 pb-4 min-h-0">
    <section class="kds-col flex flex-col min-h-0 rounded-[28px] bg-navy-2/80 p-4">
      <h2 class="eyebrow text-sky mb-3 flex items-center gap-2 flex-wrap">Staged / Held <span class="text-mist/50 normal-case tracking-normal font-sans font-medium">(Smart Queue Delay)</span> <span id="count-STAGED" class="px-2 rounded-full bg-sky/20">0</span></h2>
      <div id="col-STAGED" class="space-y-3 overflow-y-auto"></div>
    </section>
    <section class="kds-col flex flex-col min-h-0 rounded-[28px] bg-navy-2/80 p-4">
      <h2 class="eyebrow text-ember mb-3 flex items-center gap-2 flex-wrap">Cooking / Prepare now <span id="count-COOKING" class="px-2 rounded-full bg-ember/20">0</span></h2>
      <div id="col-COOKING" class="space-y-3 overflow-y-auto"></div>
    </section>
    <section class="kds-col flex flex-col min-h-0 rounded-[28px] bg-navy-2/80 p-4">
      <h2 class="eyebrow text-mint mb-3 flex items-center gap-2 flex-wrap">Ready for collection <span id="count-READY" class="px-2 rounded-full bg-mint/20">0</span></h2>
      <div id="col-READY" class="space-y-3 overflow-y-auto"></div>
    </section>
  </main>
  <script src="/vendor/kds.js?v=4"></script>
</body>
</html>
