<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncFlow · Kitchen Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <header id="kds-header" class="flex items-center justify-between gap-3 px-4 py-2 border-b border-slate-800">
    <h1 class="font-bold whitespace-nowrap">🍳 Kitchen Display <span class="kds-subtitle text-xs text-slate-400 font-normal">Sync-Fire KDS</span></h1>
    <div class="flex items-center gap-2 min-w-0">
      <nav id="tabs" class="flex gap-2 text-sm overflow-x-auto"></nav>
      <button id="sound-btn" type="button" class="px-2 py-1 rounded text-xs"></button>
    </div>
  </header>

  <div id="kds-error" class="hidden mx-3 mt-2 px-3 py-2 rounded bg-red-500/20 text-red-300 text-sm" role="alert"></div>

  <main class="kds-board flex-1 grid grid-cols-3 gap-3 p-3 min-h-0">
    <section class="kds-col flex flex-col min-h-0">
      <h2 class="text-xs uppercase tracking-wide text-amber-300 mb-2">Staged / Held <span class="text-slate-500">(Smart Queue Delay)</span> <span id="count-STAGED" class="ml-1 px-1.5 rounded bg-amber-400/20">0</span></h2>
      <div id="col-STAGED" class="space-y-2 overflow-y-auto"></div>
    </section>
    <section class="kds-col flex flex-col min-h-0">
      <h2 class="text-xs uppercase tracking-wide text-red-400 mb-2">Active Cooking / Prepare Now <span id="count-COOKING" class="ml-1 px-1.5 rounded bg-red-500/20">0</span></h2>
      <div id="col-COOKING" class="space-y-2 overflow-y-auto"></div>
    </section>
    <section class="kds-col flex flex-col min-h-0">
      <h2 class="text-xs uppercase tracking-wide text-green-400 mb-2">Ready for Collection <span id="count-READY" class="ml-1 px-1.5 rounded bg-green-400/20">0</span></h2>
      <div id="col-READY" class="space-y-2 overflow-y-auto"></div>
    </section>
  </main>
  <script src="/vendor/kds.js"></script>
</body>
</html>
